[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:octane]
command=/bin/sh -c "exec php /app/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000 --workers=${OCTANE_WORKERS:-auto} --max-requests=1000"
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:horizon]
command=php /app/artisan horizon
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
; Horizon manages its own worker processes internally per config/horizon.php
; (one supervisor per app queue) — this is the single supervisord entry
; that starts Horizon's master process, not a per-worker pool like
; queue:work needed. stopwaitsecs is generous so Horizon can finish
; in-flight jobs and shut its own supervisors down cleanly on redeploy.
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:scheduler]
command=/bin/sh -c 'case "${RUN_SCHEDULER:-true}" in [Tt][Rr][Uu][Ee]|1|[Yy][Ee][Ss]) exec php /app/artisan schedule:work;; *) echo "Scheduler disabled on this replica" && exec sleep infinity;; esac'
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=2
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
