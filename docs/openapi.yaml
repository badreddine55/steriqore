  /v1/alerts/detect:
    post:
      operationId: v1.alerts.detect
      summary: |-
        Manual trigger — in production this also runs on a schedule
        (routes/console.php), but a stock manager can run it on demand too
      tags:
        - Alert
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  low_stock:
                    type: integer
                  near_expiry:
                    type: integer
                  expired:
                    type: integer
                required:
