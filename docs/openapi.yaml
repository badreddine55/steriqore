openapi: 3.1.0
info:
  title: SteriQore
  version: 1.0.0
  description: 'SteriQore sterilization traceability and inventory API. Endpoints under /mock-* namespaces or documented as MOCK have no backing domain tables yet — see docs/erd.md and docs/backlog.md for the real ship date.'
servers:
  - url: 'http://localhost:8000/api'
paths:
  /v1/invitations/accept:
    post:
      operationId: v1.invitations.accept
      summary: |-
        Public — the invitee has no session/token yet. For an email that
        already belongs to an account, this still requires that account's
        real password (see AcceptInvitationAction) rather than trusting
        whoever clicked the link
      tags:
        - AcceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  token_type: { type: string, const: Bearer }
                  user: { $ref: '#/components/schemas/UserData' }
                  tenant: { $ref: '#/components/schemas/TenantData' }
                required:
                  - token
                  - token_type
                  - user
                  - tenant
        422:
          description: 'SteriQore API error envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /v1/audit-events:
    get:
      operationId: v1.audit-events.index
      summary: |-
        The append-only trail for the practice the current token is scoped
        to — filtered by AuditEvent's TenantScope global scope, not a manual
        where() here. Newest first; cursor-paginated per the API conventions
      tags:
        - AuditEvent
      responses:
        200:
          description: '`CursorPaginatedDataCollection`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginatedDataCollection'
        403:
          description: 'SteriQore API error envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
        401:
          description: 'SteriQore API error envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /v1/cycles:
    get:
      operationId: v1.cycles.index
      tags:
        - CyclesMock
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, prefixItems: [{ type: object, properties: { id: { type: string, const: 01977a1e-2c3b-7000-8000-000000000020 }, device_id: { type: string, const: 01977a1e-2c3b-7000-8000-000000000030 }, cycle_number: { type: string, const: A-2026-000042 }, status: { type: string, const: released }, result: { type: string, const: compliant }, started_at: { type: string, const: '2026-07-24T08:00:00Z' }, ended_at: { type: string, const: '2026-07-24T08:45:00Z' } }, required: [id, device_id, cycle_number, status, result, started_at, ended_at] }], minItems: 1, maxItems: 1, additionalItems: false }
                  meta: { type: object, properties: { next_cursor: { type: 'null' } }, required: [next_cursor] }
                required:
                  - data
                  - meta
        401:
          description: 'SteriQore API error envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  '/v1/purchase-orders/{purchaseOrder}/receipts':
    post:
      operationId: v1.purchase-orders.receipts.store
