  /v1/auth/login:
    post:
      operationId: v1.auth.login
      description: |-
        The token authenticates for `tenant_slug` only — a user who belongs to
        more than one practice logs in once per practice and holds a separate
        token for each. There is no client-supplied tenant on any other
        endpoint; every subsequent request resolves its tenant from this token.
      summary: 'Log in and receive a Sanctum token scoped to one practice'
      tags:
        - Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  token_type: { type: string, const: Bearer }
                  user: { $ref: '#/components/schemas/UserData' }
                  tenant: { $ref: '#/components/schemas/TenantData' }
                required:
                  - token
                  - token_type
                  - user
                  - tenant
        422:
          description: 'SteriQore API error envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /v1/auth/logout:
    delete:
      operationId: v1.auth.logout
      summary: |-
        Revoke the token used for this request. Other tokens (other devices,
        other practices) are untouched
      tags:
        - Logout
      responses:
        204:
          description: 'No content'
        401:
          description: 'SteriQore API error envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /v1/auth/tokens:
    delete:
      operationId: v1.auth.logout-everywhere
      summary: |-
        Revoke every token for this practice — not just the one used for this
        request. Tokens for other practices the same user belongs to are
        untouched (a token authenticates for exactly one tenant)
      tags:
        - LogoutEverywhere
      responses:
        204:
          description: 'No content'
        401:
          description: 'SteriQore API error envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /v1/me:
    get:
      operationId: v1.me
