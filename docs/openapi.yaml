  '/v1/members/{tenantUser}':
    delete:
      operationId: v1.members.destroy
      summary: |-
        Disables a member's access to this practice — see
        DisableTenantMembershipAction. Not BelongsToTenant-scoped (same
        bootstrap reason as Invitation), so the tenant match is checked
        before authorize(), same IDOR-safe pattern as InvitationController
      tags:
        - Member
      parameters:
        -
          name: tenantUser
          in: path
          required: true
          description: 'The tenant user ID'
          schema:
            type: string
      responses:
        204:
          description: 'No content'
        403:
          description: 'SteriQore API error envelope.'
          content:
            application/json:
              schema:
