components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
        name:
          type: string
          maxLength: 255
        password:
          type: string
      required:
        - token
        - name
        - password
      title: AcceptInvitationRequest
    AddCycleItemRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 255
        batch_id:
          type:
            - string
            - 'null'
          format: uuid
          description: |-
            Optional — not every item is a batch-tracked consumable
            (e.g. reusable instruments with no Inventory batch at all).
      required:
        - description
      title: AddCycleItemRequest
    AdjustStockRequest:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        qty:
          type: integer
        reason:
          type: string
          description: |-
            Mandatory, unlike issue/transfer: an adjustment is a
            correction with no other evidence behind it.
          maxLength: 1000
      required:
        - batch_id
        - location_id
        - qty
        - reason
      title: AdjustStockRequest
    AlertData:
      type: object
      additionalProperties: {}
      title: AlertData
    ApiErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
            request_id:
              type: string
          required:
            - code
            - message
            - details
            - request_id
      required:
        - error
      title: ApiErrorEnvelope
    AttachCycleFileRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          contentMediaType: application/octet-stream
          description: 'Maximum file size: 10240 kilobytes.'
      required:
        - file
      title: AttachCycleFileRequest
    AttachSupplierProductRequest:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        supplier_reference:
          type:
            - string
            - 'null'
          maxLength: 255
        pack_size:
          type: integer
          minimum: 1
        price:
          type:
            - number
            - 'null'
          minimum: 0
      required:
        - product_id
      title: AttachSupplierProductRequest
    CancelPurchaseOrderRequest:
      type: object
      properties:
        reason:
          type:
            - string
            - 'null'
          maxLength: 1000
      title: CancelPurchaseOrderRequest
    ControlTestData:
      type: object
      additionalProperties: {}
      title: ControlTestData
    ControlTestResult:
      type: string
      enum:
        - pass
        - fail
      title: ControlTestResult
    ControlTestType:
      type: string
      enum:
        - vacuum
        - bowie_dick
        - helix
        - biological
      title: ControlTestType
    CreateCycleRequest:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        device_program_id:
          type:
            - string
            - 'null'
          format: uuid
        notes:
          type:
            - string
            - 'null'
      required:
        - device_id
      title: CreateCycleRequest
    CreateDeviceProgramRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        target_temperature_celsius:
          type: integer
          minimum: 1
          maximum: 200
        plateau_minutes:
          type: integer
          minimum: 1
          maximum: 600
        is_active:
          type: boolean
      required:
        - name
        - target_temperature_celsius
        - plateau_minutes
      title: CreateDeviceProgramRequest
    CreateDeviceRequest:
      type: object
      properties:
        site_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        serial_number:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/DeviceKind'
        status:
          $ref: '#/components/schemas/DeviceStatus'
        manufacturer:
          type:
            - string
            - 'null'
          maxLength: 255
        model:
          type:
            - string
            - 'null'
          maxLength: 255
        commissioned_at:
          type:
            - string
            - 'null'
          format: date-time
        decommissioned_at:
          type:
            - string
            - 'null'
          format: date-time
        notes:
          type:
            - string
            - 'null'
      required:
        - site_id
        - name
        - serial_number
      title: CreateDeviceRequest
    CreateDluRuleRequest:
      type: object
      properties:
        packaging_type:
          type: string
          maxLength: 255
        storage_condition:
          type: string
          maxLength: 255
        shelf_life_days:
          type: integer
          minimum: 1
      required:
        - packaging_type
        - storage_condition
        - shelf_life_days
      title: CreateDluRuleRequest
    CreateInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/TenantRole'
      required:
        - email
        - role
      title: CreateInvitationRequest
    CreateProductCategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        parent_category_id:
          type:
            - string
            - 'null'
          format: uuid
      required:
        - name
      title: CreateProductCategoryRequest
    CreateProductRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        reference:
          type: string
          maxLength: 100
        unit:
          type: string
          maxLength: 50
        min_threshold:
          type: integer
          minimum: 0
        is_sterilizable:
          type: boolean
        barcode:
          type:
            - string
            - 'null'
          maxLength: 100
        category_id:
          type:
            - string
            - 'null'
          format: uuid
        default_location_id:
          type:
            - string
            - 'null'
          format: uuid
      required:
        - name
        - reference
      title: CreateProductRequest
    CreatePurchaseOrderRequest:
      type: object
      properties:
        supplier_id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
                format: uuid
              qty_ordered:
                type: integer
                minimum: 1
              unit_price:
                type:
                  - number
                  - 'null'
                minimum: 0
            required:
              - product_id
              - qty_ordered
          minItems: 1
      required:
        - supplier_id
        - lines
      title: CreatePurchaseOrderRequest
    CreateSupplierRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
        phone:
          type:
            - string
            - 'null'
          maxLength: 50
        address:
          type:
            - string
            - 'null'
          maxLength: 1000
      required:
        - name
      title: CreateSupplierRequest
    CursorPaginatedDataCollection:
      type: object
      additionalProperties: {}
      title: CursorPaginatedDataCollection
    CycleAttachmentData:
      type: object
      additionalProperties: {}
      title: CycleAttachmentData
    CycleData:
      type: object
      additionalProperties: {}
      title: CycleData
    CycleItemData:
      type: object
      additionalProperties: {}
      title: CycleItemData
    CycleReleaseData:
      type: object
      additionalProperties: {}
      title: CycleReleaseData
    CycleReleaseDecision:
      type: string
      enum:
        - compliant
        - rejected
      title: CycleReleaseDecision
    DataCollection:
      type: object
      additionalProperties: {}
      title: DataCollection
    DeviceData:
      type: object
      additionalProperties: {}
      title: DeviceData
    DeviceKind:
      type: string
      enum:
        - autoclave
        - washer_disinfector
        - sealer
        - other
      title: DeviceKind
    DeviceProgramData:
      type: object
      additionalProperties: {}
      title: DeviceProgramData
    DeviceStatus:
      type: string
      description: |
        A device is never deleted while any cycle references it (soft-delete only), but it can be taken out of service without deleting anything — that's what Maintenance/Decommissioned are for. S3-ANA-02 will forbid starting a new cycle on a device that isn't Active.
      enum:
        - active
        - maintenance
        - decommissioned
      title: DeviceStatus
    DluRuleData:
      type: object
      additionalProperties: {}
      title: DluRuleData
    GenerateCycleLabelsRequest:
      type: object
      properties:
        packaging_type:
          type: string
          maxLength: 255
        storage_condition:
          type: string
          maxLength: 255
      required:
        - packaging_type
        - storage_condition
      title: GenerateCycleLabelsRequest
    GoodsReceiptData:
      type: object
      additionalProperties: {}
      title: GoodsReceiptData
    InvitationData:
      type: object
      additionalProperties: {}
      title: InvitationData
    IssueStockRequest:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 1
        reason:
          type:
            - string
            - 'null'
          maxLength: 1000
      required:
        - batch_id
        - location_id
        - qty
      title: IssueStockRequest
    LabelData:
      type: object
      additionalProperties: {}
      title: LabelData
    LabelScanResultData:
      type: object
      additionalProperties: {}
      title: LabelScanResultData
    LabelUsageData:
      type: object
      additionalProperties: {}
      title: LabelUsageData
    LoginRequest:
      type: object
      properties:
        tenant_slug:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - tenant_slug
        - email
        - password
      title: LoginRequest
    MaintenanceKind:
      type: string
      enum:
        - preventive
        - corrective
        - calibration
      title: MaintenanceKind
    MaintenanceRecordData:
      type: object
      additionalProperties: {}
      title: MaintenanceRecordData
    PatientData:
      type: object
      additionalProperties: {}
      title: PatientData
    PrintLabelRequest:
      type: object
      properties:
        reason:
          type:
            - string
            - 'null'
          description: |-
            Required only on a reprint (the label is already Printed) —
            CLAUDE.md invariant #4. Route model binding has already
            resolved {label} by the time this runs.
          maxLength: 2000
      title: PrintLabelRequest
    ProductCategoryData:
      type: object
      additionalProperties: {}
      title: ProductCategoryData
    ProductData:
      type: object
      additionalProperties: {}
      title: ProductData
    PurchaseOrderData:
      type: object
      additionalProperties: {}
      title: PurchaseOrderData
    ReceiveGoodsRequest:
      type: object
      properties:
        location_id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            properties:
              purchase_order_line_id:
                type: string
                format: uuid
              batch_number:
                type: string
                maxLength: 255
              expiry_date:
                type:
                  - string
                  - 'null'
                format: date-time
              qty:
                type: integer
                minimum: 1
              discrepancy_reason:
                type:
                  - string
                  - 'null'
                maxLength: 1000
            required:
              - purchase_order_line_id
              - batch_number
              - qty
          minItems: 1
      required:
        - location_id
        - lines
      title: ReceiveGoodsRequest
    RecordControlTestRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ControlTestType'
        result:
          $ref: '#/components/schemas/ControlTestResult'
        performed_at:
          type: string
          format: date-time
        notes:
          type:
            - string
            - 'null'
      required:
        - type
        - result
        - performed_at
      title: RecordControlTestRequest
    RecordLabelUsageRequest:
      type: object
      properties:
        patient_id:
          type: string
          format: uuid
        practitioner_id:
          type: string
          format: uuid
          description: |-
            users aren't tenant-scoped directly (BelongsToTenant would
            be wrong for a global identity table) — membership is via
            tenant_user, so that's what has to be checked here.
        procedure:
          type: string
          maxLength: 255
        used_at:
          type:
            - string
            - 'null'
          format: date-time
        notes:
          type:
            - string
            - 'null'
      required:
        - patient_id
        - practitioner_id
        - procedure
      title: RecordLabelUsageRequest
    RecordMaintenanceRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/MaintenanceKind'
        technician:
          type:
            - string
            - 'null'
          maxLength: 255
        performed_at:
          type: string
          format: date-time
        next_due_at:
          type:
            - string
            - 'null'
          format: date-time
        description:
          type:
            - string
            - 'null'
      required:
        - kind
        - performed_at
      title: RecordMaintenanceRequest
    RegisterTenantRequest:
      type: object
      properties:
        tenant_name:
          type: string
          maxLength: 255
        tenant_slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 63
        owner_name:
          type: string
          maxLength: 255
        owner_email:
          type: string
          format: email
        password:
          type: string
      required:
        - tenant_name
        - tenant_slug
        - owner_name
        - owner_email
        - password
      title: RegisterTenantRequest
    ReleaseCycleRequest:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/CycleReleaseDecision'
        reason:
          type:
            - string
            - 'null'
          description: |-
            A compliant release doesn't need a reason; a rejection
            always needs one — this is the release evidence, it has to
            say why.
          maxLength: 2000
      required:
        - decision
      title: ReleaseCycleRequest
    StockMovementData:
      type: object
      additionalProperties: {}
      title: StockMovementData
    SupplierData:
      type: object
      additionalProperties: {}
      title: SupplierData
    SupplierProductData:
      type: object
      additionalProperties: {}
      title: SupplierProductData
    TenantData:
      type: object
      additionalProperties: {}
      title: TenantData
    TenantRole:
      type: string
      description: |
        The six roles from CLAUDE.md's RBAC section. Not yet wired to spatie/laravel-permission (that's S1-ANA-03) — used for now just to validate the `role` field on an invitation against a fixed, known set.
      enum:
        - owner
        - admin
        - stock_manager
        - releaser
        - practitioner
        - viewer
      title: TenantRole
    TransferStockRequest:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        from_location_id:
          type: string
          format: uuid
        to_location_id:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 1
        reason:
          type:
            - string
            - 'null'
          maxLength: 1000
      required:
        - batch_id
        - from_location_id
        - to_location_id
        - qty
      title: TransferStockRequest
    UpdateDeviceProgramRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        target_temperature_celsius:
          type: integer
          minimum: 1
          maximum: 200
        plateau_minutes:
          type: integer
          minimum: 1
          maximum: 600
        is_active:
          type: boolean
      title: UpdateDeviceProgramRequest
    UpdateDeviceRequest:
      type: object
      properties:
        site_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        serial_number:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/DeviceKind'
        status:
          $ref: '#/components/schemas/DeviceStatus'
        manufacturer:
          type:
            - string
            - 'null'
          maxLength: 255
        model:
          type:
            - string
            - 'null'
          maxLength: 255
        commissioned_at:
          type:
            - string
            - 'null'
          format: date-time
        decommissioned_at:
          type:
            - string
            - 'null'
          format: date-time
        notes:
          type:
            - string
            - 'null'
      title: UpdateDeviceRequest
    UpdateDluRuleRequest:
      type: object
      properties:
        packaging_type:
          type: string
          maxLength: 255
        storage_condition:
          type: string
          maxLength: 255
        shelf_life_days:
          type: integer
          minimum: 1
      title: UpdateDluRuleRequest
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        reference:
          type: string
          maxLength: 100
        unit:
          type: string
          maxLength: 50
        min_threshold:
          type: integer
          minimum: 0
        is_sterilizable:
          type: boolean
        barcode:
          type:
            - string
            - 'null'
          maxLength: 100
        category_id:
