components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
        name:
          type: string
          maxLength: 255
        password:
          type: string
      required:
        - token
        - name
        - password
      title: AcceptInvitationRequest
    AdjustStockRequest:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        qty:
          type: integer
        reason:
          type: string
          description: |-
            Mandatory, unlike issue/transfer: an adjustment is a
            correction with no other evidence behind it.
          maxLength: 1000
      required:
        - batch_id
        - location_id
        - qty
        - reason
      title: AdjustStockRequest
    ApiErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
            request_id:
              type: string
          required:
            - code
            - message
            - details
            - request_id
      required:
        - error
      title: ApiErrorEnvelope
    AttachSupplierProductRequest:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        supplier_reference:
          type:
            - string
            - 'null'
          maxLength: 255
        pack_size:
          type: integer
          minimum: 1
        price:
          type:
            - number
            - 'null'
          minimum: 0
      required:
        - product_id
      title: AttachSupplierProductRequest
    CancelPurchaseOrderRequest:
      type: object
      properties:
        reason:
          type:
            - string
            - 'null'
          maxLength: 1000
      title: CancelPurchaseOrderRequest
    CreateInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/TenantRole'
      required:
        - email
        - role
      title: CreateInvitationRequest
    CreateProductCategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        parent_category_id:
          type:
            - string
            - 'null'
          format: uuid
      required:
        - name
      title: CreateProductCategoryRequest
    CreateProductRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        reference:
          type: string
          maxLength: 100
        unit:
          type: string
          maxLength: 50
        min_threshold:
          type: integer
          minimum: 0
        is_sterilizable:
          type: boolean
        barcode:
          type:
            - string
            - 'null'
          maxLength: 100
        category_id:
          type:
            - string
            - 'null'
          format: uuid
        default_location_id:
          type:
            - string
            - 'null'
          format: uuid
      required:
        - name
        - reference
      title: CreateProductRequest
    CreatePurchaseOrderRequest:
      type: object
      properties:
        supplier_id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: string
                format: uuid
              qty_ordered:
                type: integer
                minimum: 1
              unit_price:
                type:
                  - number
                  - 'null'
                minimum: 0
            required:
              - product_id
              - qty_ordered
          minItems: 1
      required:
        - supplier_id
        - lines
      title: CreatePurchaseOrderRequest
    CreateSupplierRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
        phone:
          type:
            - string
            - 'null'
          maxLength: 50
        address:
          type:
            - string
            - 'null'
          maxLength: 1000
      required:
        - name
      title: CreateSupplierRequest
    CursorPaginatedDataCollection:
      type: object
      additionalProperties: {}
      title: CursorPaginatedDataCollection
    GoodsReceiptData:
      type: object
      additionalProperties: {}
      title: GoodsReceiptData
    InvitationData:
      type: object
      additionalProperties: {}
      title: InvitationData
    IssueStockRequest:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 1
        reason:
          type:
            - string
            - 'null'
          maxLength: 1000
      required:
        - batch_id
        - location_id
        - qty
      title: IssueStockRequest
    LoginRequest:
      type: object
      properties:
        tenant_slug:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - tenant_slug
        - email
        - password
      title: LoginRequest
    ProductCategoryData:
      type: object
      additionalProperties: {}
      title: ProductCategoryData
    ProductData:
      type: object
      additionalProperties: {}
      title: ProductData
    PurchaseOrderData:
      type: object
      additionalProperties: {}
      title: PurchaseOrderData
    ReceiveGoodsRequest:
      type: object
      properties:
        location_id:
          type: string
          format: uuid
        lines:
          type: array
          items:
            type: object
            properties:
              purchase_order_line_id:
                type: string
                format: uuid
              batch_number:
                type: string
                maxLength: 255
              expiry_date:
                type:
                  - string
                  - 'null'
                format: date-time
              qty:
                type: integer
                minimum: 1
              discrepancy_reason:
                type:
                  - string
                  - 'null'
                maxLength: 1000
            required:
              - purchase_order_line_id
              - batch_number
              - qty
          minItems: 1
      required:
        - location_id
        - lines
      title: ReceiveGoodsRequest
    RegisterTenantRequest:
      type: object
      properties:
        tenant_name:
          type: string
          maxLength: 255
        tenant_slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 63
        owner_name:
          type: string
          maxLength: 255
        owner_email:
          type: string
          format: email
        password:
          type: string
      required:
        - tenant_name
        - tenant_slug
        - owner_name
        - owner_email
        - password
      title: RegisterTenantRequest
    StockMovementData:
      type: object
      additionalProperties: {}
      title: StockMovementData
    SupplierData:
      type: object
      additionalProperties: {}
      title: SupplierData
    SupplierProductData:
      type: object
      additionalProperties: {}
      title: SupplierProductData
    TenantData:
      type: object
      additionalProperties: {}
      title: TenantData
    TenantRole:
      type: string
      description: |
        The six roles from CLAUDE.md's RBAC section. Not yet wired to spatie/laravel-permission (that's S1-ANA-03) — used for now just to validate the `role` field on an invitation against a fixed, known set.
      enum:
        - owner
        - admin
        - stock_manager
        - releaser
        - practitioner
        - viewer
      title: TenantRole
    TransferStockRequest:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        from_location_id:
          type: string
          format: uuid
        to_location_id:
          type: string
          format: uuid
        qty:
          type: integer
          minimum: 1
        reason:
          type:
            - string
            - 'null'
          maxLength: 1000
      required:
        - batch_id
        - from_location_id
        - to_location_id
        - qty
      title: TransferStockRequest
    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        reference:
          type: string
          maxLength: 100
        unit:
          type: string
          maxLength: 50
        min_threshold:
          type: integer
          minimum: 0
        is_sterilizable:
          type: boolean
        barcode:
          type:
            - string
            - 'null'
          maxLength: 100
        category_id:
          type:
            - string
            - 'null'
          format: uuid
        default_location_id:
          type:
            - string
            - 'null'
          format: uuid
      title: UpdateProductRequest
    UpdateSupplierRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 255
        phone:
          type:
            - string
            - 'null'
          maxLength: 50
        address:
          type:
            - string
            - 'null'
          maxLength: 1000
      title: UpdateSupplierRequest
    UserData:
      type: object
      additionalProperties: {}
      title: UserData
