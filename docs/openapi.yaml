openapi: 3.1.0
info:
  title: SteriQore
  version: 1.0.0
  description: 'SteriQore sterilization traceability and inventory API. Endpoints under /mock-* namespaces or documented as MOCK have no backing domain tables yet — see docs/erd.md and docs/backlog.md for the real ship date.'
servers:
  - url: 'http://localhost:8000/api'
paths:
  /v1/invitations/accept:
    post:
      operationId: v1.invitations.accept
      summary: |-
        Public — the invitee has no session/token yet. For an email that
        already belongs to an account, this still requires that account's
        real password (see AcceptInvitationAction) rather than trusting
        whoever clicked the link
      tags:
        - AcceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  token_type:
                    type: string
                    const: Bearer
                  user:
                    $ref: '#/components/schemas/UserData'
                  tenant:
                    $ref: '#/components/schemas/TenantData'
                required:
                  - token
                  - token_type
                  - user
                  - tenant
        422:
          description: 'SteriQore API error envelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorEnvelope'
  /v1/alerts:
    get:
      operationId: v1.alerts.index
      tags:
        - Alert
      responses:
        200:
          description: '`CursorPaginatedDataCollection`'
          content:
            application/json:
              schema:
