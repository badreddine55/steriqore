# =============================================================================
# SAW — Development Docker Compose
# =============================================================================
# All services use non-conflicting external ports to avoid clashes with
# locally running services. Internal ports remain standard for inter-container
# communication via the shared 'saw' network.
#
# Port Mapping Reference:
#   PostgreSQL:   5443  → 5432
#   Redis:        6389  → 6379
#   Mailpit SMTP: 1045  → 1025
#   Mailpit Web:  8027   → 8025
#   MinIO API:    9013   → 9000
#   MinIO Console:9014   → 9001
#   SAW App:  8000   → 8000
# =============================================================================

services:
  # ─── SAW Application ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saw-app
    restart: unless-stopped
    ports:
      - '8000:8000'
    develop:
      watch:
        # 1. Sync app code changes directly to the container's working directory
        - action: sync
          path: .
          target: /var/www/html # Assuming this is your WORKDIR based on your volume mounts
          ignore:
            - vendor/
            - node_modules/
            - storage/
            - .git/

        # 2. Sync and restart the container if environment variables change
        - action: sync+restart
          path: .env
          target: /var/www/html/.env

        # 3. Rebuild the entire image if dependencies or your Dockerfile change
        - action: rebuild
          path: composer.lock
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: package.json
        - action: rebuild
          path: Dockerfile
    env_file:
      - .env
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - OCTANE_SERVER=frankenphp
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=saw
      - DB_USERNAME=saw
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_FROM_ADDRESS=hello@saw.local
      - MAIL_FROM_NAME=saw
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=saw
      - AWS_ENDPOINT=http://minio:9000
      - AWS_URL=http://localhost:9013/saw
      - AWS_USE_PATH_STYLE_ENDPOINT=true
      - FILESYSTEM_DISK=s3
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - saw
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/api/health'] # internal port
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── PostgreSQL 18 ────────────────────────────────────────────────────
  # PG 18+ mounts at /var/lib/postgresql (PGDATA defaults to
  # /var/lib/postgresql/18/docker). Existing PG 17 volumes are incompatible —
  # recreate the postgres-data volume after upgrading.
  postgres:
    image: postgres:18-alpine
    container_name: saw-postgres
    restart: unless-stopped
    ports:
      - '5443:5432'
    environment:
      POSTGRES_DB: saw
      POSTGRES_USER: saw
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - saw
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saw -d saw']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 8 ──────────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: saw-redis
    restart: unless-stopped
    ports:
      - '6389:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - saw
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Mailpit (Email Testing) ─────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: saw-mailpit
    restart: unless-stopped
    ports:
      - '1045:1025' # SMTP
      - '8027:8025' # Web UI
    networks:
      - saw

  # ─── MinIO (S3-Compatible Storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: saw-minio
    restart: unless-stopped
    ports:
      - '9013:9000' # API
      - '9014:9001' # Console
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - saw
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── MinIO Bucket Initialization ─────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: saw-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb local/saw --ignore-existing;
        mc anonymous set public local/saw;
        echo 'MinIO bucket initialized.';
      "
    networks:
      - saw
    restart: 'no'

# ─── Volumes ──────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  app-storage:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────
networks:
  saw:
    driver: bridge
