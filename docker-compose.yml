# =============================================================================
# Steriqore — Development Docker Compose
# =============================================================================
# All services use non-conflicting external ports to avoid clashes with
# locally running services (including the SAW stack). Internal ports remain
# standard for inter-container communication via the shared 'steriqore' network.
#
# Port Mapping Reference:
#   PostgreSQL:     5455  → 5432
#   Redis:          6395  → 6379
#   Mailpit SMTP:   1055  → 1025
#   Mailpit Web:    8035  → 8025
#   MinIO API:      9023  → 9000
#   MinIO Console:  9024  → 9001
#   Steriqore App:  8010  → 8000
# =============================================================================

services:
  # ─── Steriqore Application ──────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steriqore-app
    restart: unless-stopped
    ports:
      - '8010:8000'
    develop:
      watch:
        # Sync PHP / config and restart Octane so changes apply without a full rebuild
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: sync+restart
          path: ./bootstrap
          target: /app/bootstrap
        - action: sync+restart
          path: ./config
          target: /app/config
        - action: sync+restart
          path: ./database
          target: /app/database
        - action: sync+restart
          path: ./routes
          target: /app/routes
        # Frontend source — rebuild assets on the host (or via ./steriqore.sh assets)
        - action: sync
          path: ./resources
          target: /app/resources
        - action: sync
          path: ./public
          target: /app/public
          ignore:
            - public/hot
        # Env changes: sync + restart
        - action: sync+restart
          path: ./.env
          target: /app/.env
        # Dependency / image changes: full rebuild
        - action: rebuild
          path: ./composer.lock
        - action: rebuild
          path: ./composer.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./Dockerfile
    env_file:
      - .env
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8010
      - OCTANE_SERVER=frankenphp
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=saw
      # Runtime app connection: a restricted, non-superuser role so Row-Level
      # Security actually applies (superusers and table owners bypass RLS
      # unconditionally). See docker/postgres/init/01-create-app-role.sql.
      - DB_USERNAME=steriqore_app
      - DB_PASSWORD=steriqore_app_secret
      # Elevated connection, migrations only (CREATE TABLE/POLICY etc. need
      # more than steriqore_app's grants). Never used for a normal request.
      - DB_ADMIN_USERNAME=saw
      - DB_ADMIN_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_FROM_ADDRESS=hello@saw.local
      - MAIL_FROM_NAME=saw
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=saw
      - AWS_BUCKET_MEDIA=steriqore-media
      - AWS_ENDPOINT=http://minio:9000
      - AWS_URL=http://localhost:9023/saw
      - AWS_USE_PATH_STYLE_ENDPOINT=true
      - FILESYSTEM_DISK=s3
    volumes:
      - app-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - steriqore
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/up']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── PostgreSQL 18 ────────────────────────────────────────────────────
  # PG 18+ mounts at /var/lib/postgresql (PGDATA defaults to
  # /var/lib/postgresql/18/docker). Existing PG 17 volumes are incompatible —
  # recreate the postgres-data volume after upgrading.
  postgres:
    image: postgres:18-alpine
    container_name: steriqore-postgres
    restart: unless-stopped
    ports:
      - '5455:5432'
    environment:
      POSTGRES_DB: saw
      POSTGRES_USER: saw
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - steriqore
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saw -d saw']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 8 ──────────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: steriqore-redis
    restart: unless-stopped
    ports:
      - '6395:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - steriqore
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Mailpit (Email Testing) ─────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: steriqore-mailpit
    restart: unless-stopped
    ports:
      - '1055:1025' # SMTP
      - '8035:8025' # Web UI
    networks:
      - steriqore

  # ─── MinIO (S3-Compatible Storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: steriqore-minio
    restart: unless-stopped
    ports:
      - '9023:9000' # API
      - '9024:9001' # Console
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - steriqore
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── MinIO Bucket Initialization ─────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: steriqore-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb local/saw --ignore-existing;
        mc anonymous set public local/saw;
        mc mb local/steriqore-media --ignore-existing;
        echo 'MinIO buckets initialized.';
      "
    networks:
      - steriqore
    restart: 'no'

# ─── Volumes ──────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  app-storage:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────
networks:
  steriqore:
    driver: bridge
