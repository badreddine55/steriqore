name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # UI-31: the §10 demo journey (docs/00-BUILD-BRIEF.md), driven end to end
  # against the real Docker stack — Postgres, Redis, MinIO, Mailpit, Horizon
  # actually processing jobs. Deliberately its own job, not a step in `ci`
  # above: it's slow by design (registers real tenants, sends real mail),
  # and a failure here means the product's own acceptance story is broken,
  # not a unit-level regression — worth seeing as a distinct, required
  # check rather than folded into the same signal as lint/types/Pest.
  e2e-acceptance:
    name: E2E acceptance suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Prepare environment file
        run: |
          cp .env.example .env
          APP_KEY="base64:$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env

      - name: Build and start the Docker stack
        run: docker compose up -d --build --wait

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run the E2E acceptance suite
        run: npm run e2e:acceptance

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-acceptance-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down the Docker stack
        if: always()
        run: docker compose down -v
