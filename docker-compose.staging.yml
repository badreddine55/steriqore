# =============================================================================
# SteriQore — Staging Docker Compose (S5-ANA-02)
# =============================================================================
# A skeleton, not a deployed environment: no staging host, domain, Sentry
# project, or mail/S3 account exists yet (see docs/open-questions.md,
# OQ-10). What this file does NOT decide, on purpose:
#   - Where this runs (a single VM, a managed container platform, etc.)
#   - TLS/reverse proxy and the public domain — FrankenPHP serves plain
#     HTTP on :8000 (see docker/supervisord.conf); something in front of
#     this stack has to terminate TLS and forward to it.
#   - Whether Postgres/Redis/S3 stay self-hosted (as below, mirroring
#     local dev) or move to managed services later.
#
# Copy .env.staging.example to .env.staging and fill in every CHANGE_ME
# before using this file. Bring up with:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steriqore-app-staging
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env.staging
    volumes:
      - app-storage-staging:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - steriqore-staging
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/up']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    container_name: steriqore-postgres-staging
    restart: unless-stopped
    # No host port mapping — staging Postgres is only reachable from the
    # app container on the internal network. Use an SSH tunnel for direct
    # access if it's ever genuinely needed.
    environment:
      POSTGRES_DB: steriqore
      POSTGRES_USER: saw
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    volumes:
      - postgres-data-staging:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - steriqore-staging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saw -d steriqore']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: steriqore-redis-staging
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data-staging:/data
    networks:
      - steriqore-staging
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted S3-compatible storage — the same image as local dev, no
  # external account needed. Swap for a managed provider later if that
  # becomes the production choice (nothing in the app depends on which).
  minio:
    image: minio/minio:latest
    container_name: steriqore-minio-staging
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - minio-data-staging:/data
    networks:
      - steriqore-staging
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: steriqore-minio-init-staging
    depends_on:
      minio:
        condition: service_healthy
    # Values substituted by docker compose itself (from --env-file
    # .env.staging) at "up" time, not by the container's shell — no
    # escaping needed, unlike a value the container's own shell expands.
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY};
        mc mb local/${AWS_BUCKET} --ignore-existing;
        mc mb local/${AWS_BUCKET_MEDIA} --ignore-existing;
        mc mb local/${AWS_BUCKET_BACKUPS} --ignore-existing;
        echo 'MinIO buckets initialized (private — no anonymous access set).';
      "
    networks:
      - steriqore-staging
    restart: 'no'

volumes:
  postgres-data-staging:
    driver: local
  redis-data-staging:
    driver: local
  minio-data-staging:
    driver: local
  app-storage-staging:
    driver: local

networks:
  steriqore-staging:
    driver: bridge
